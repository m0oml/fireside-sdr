# WirePlumber: leave the FlexRadio's sound card alone (installed by system/setup-system.sh into ~/.config/wireplumber/wireplumber.conf.d/).
# Without this PipeWire opens the radio's 8-channel card, may make it the DEFAULT output (desktop sound and synths then play out of the
# radio's speaker/headphone jacks at full level), and holds the device so fireside/firesidecapture/firesideplay get "Device or resource busy".
# Matches every FlexRadio FireWire unit (IEEE vendor id 0x001c2d in the card name). The app talks to the card directly through ALSA.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.firewire-0x001c2d.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
