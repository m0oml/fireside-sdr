# Fireside SDR: two virtual audio devices for other programs (WSJT-X, JS8Call, fldigi ...). Installed by system/setup-system.sh into
# ~/.config/pipewire/pipewire.conf.d/. Nothing here touches the radio's own sound card (the WirePlumber rule keeps PipeWire off it).
#   Fireside RX audio: Fireside SDR plays the receive audio into it; the other program records "Monitor of Fireside RX audio".
#   Fireside TX audio: the other program plays its transmit audio into it; Fireside SDR records "Fireside TX audio (input)" and transmits it
#                      (only while "Let other programs key" is ticked on the Transmit card and the program keys over CAT).
#                      A loopback, not a null sink: Qt (which Fireside SDR uses) does not list "Monitor of ..." sources as inputs.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "fireside_rx"
            node.description = "Fireside RX audio"
            media.class      = Audio/Sink
            audio.position   = [ MONO ]
            audio.rate       = 48000
            object.linger    = true
            monitor.channel-volumes = true
            priority.session = 0             # never chosen as the default output
        }
    }
]

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Fireside TX audio"
            capture.props = {
                node.name        = "fireside_tx"
                node.description = "Fireside TX audio"
                media.class      = Audio/Sink
                audio.position   = [ MONO ]
                audio.rate       = 48000
                priority.session = 0         # never chosen as the default output
            }
            playback.props = {
                node.name        = "fireside_tx_in"
                node.description = "Fireside TX audio (input)"
                media.class      = Audio/Source
                audio.position   = [ MONO ]
                audio.rate       = 48000
                priority.session = 0         # never chosen as the default input
            }
        }
    }
]
